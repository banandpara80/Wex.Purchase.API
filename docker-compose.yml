services:
  postgres:
    image: postgres:16
    container_name: wex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wex_purchase_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: wex-purchase-api:latest
    container_name: wex-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wex_purchase_db;Username=postgres;Password=postgres;"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: seq_dashboard
    restart: unless-stopped
    ports:
      - "8081:80"      # Web UI Dashboard (Accessible at http://localhost:8081)
      - "5341:5341"    # Ingestion Port for logs
    environment:
      - ACCEPT_EULA=Y  # Mandatory to accept the Seq license agreement
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True

    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data:
